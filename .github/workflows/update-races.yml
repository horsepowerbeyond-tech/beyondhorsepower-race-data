name: Update BeyondHorsepower races
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Optional season (blank uses the current UTC year)'
        required: false
        type: string
      round:
        description: 'Optional completed round to reprocess (blank updates newest pending races)'
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: beyondhorsepower-race-data
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_RACE_UPDATES == 'true')
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://beyondhorsepower-race-data.pages.dev' }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'beyondhorsepower-race-data' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare folders from the uploaded files
        shell: bash
        run: |
          mkdir -p automation tests public/races
          cp deploy_cloudflare.py export_races.py publish_pages.py restore_archive.py automation/
          cp test_cloudflare.py test_publisher.py test_worker.py tests/
          cp _headers index.html 404.html index.json public/
          cp 2024-08.json public/races/
      - name: Check access to the existing Pages project
        run: python automation/deploy_cloudflare.py --check-only
      - name: Preserve all replays already on Cloudflare
        run: python automation/restore_archive.py --base "$PUBLIC_BASE_URL" --output public
      - name: Install race data library
        run: pip install -r requirements.txt
      - name: Check worker and publisher
        run: python -m unittest discover -s tests -v
      - name: Check race data source access
        run: |
          python - <<'PY'
          import fastf1
          import requests
          from fastf1 import _api

          session = fastf1.get_session(2026, 15, "R")
          print("Checking:", session.event.EventName, flush=True)

          for host in [_api.base_url, _api.base_url_mirror]:
              for page in ["SessionInfo.jsonStream", "TimingData.jsonStream"]:
                  url = host + session.api_path + page
                  try:
                      with requests.get(
                          url,
                          headers=_api.headers,
                          stream=True,
                          timeout=20,
                      ) as response:
                          print(
                              host, page, "HTTP", response.status_code,
                              flush=True,
                          )
                  except requests.RequestException as error:
                      print(host, page, type(error).__name__, str(error), flush=True)
          PY
      - name: Prepare completed races and calendar
        env:
          RACE_YEAR: ${{ inputs.year || vars.RACE_YEAR }}
          RACE_ROUND: ${{ inputs.round }}
        shell: bash
        run: |
          race_year="${RACE_YEAR:-$(date -u +%Y)}"
          race_args=(--year "$race_year" --output public --max-races 2 --refresh)
          if [ -n "$RACE_ROUND" ]; then
            race_args+=(--round "$RACE_ROUND")
          fi
          python automation/export_races.py "${race_args[@]}"
      - name: Validate prepared data
        run: python automation/restore_archive.py --output public --validate-only
      - name: Sync Shopify pages when enabled
        id: shopify_sync
        continue-on-error: true
        if: vars.ENABLE_SHOPIFY_SYNC == 'true'
        env:
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          PUBLISH_RACES: ${{ vars.PUBLISH_RACES }}
        shell: bash
        run: |
          if [ "$PUBLISH_RACES" = 'true' ]; then
            python automation/publish_pages.py --output public --publish
          else
            python automation/publish_pages.py --output public
          fi
      - name: Validate final deployment
        run: python automation/restore_archive.py --output public --validate-only
      - name: Set up deployment CLI runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy the existing Cloudflare Pages production feed
        run: python automation/deploy_cloudflare.py --output public
      - name: Report Shopify sync failure
        if: steps.shopify_sync.outcome == 'failure'
        run: |
          echo 'Race data was deployed, but Shopify page sync failed. Review that step and retry.'
          exit 1
